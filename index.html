<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ink Scan</title>
<link rel="manifest" href="manifest.json">
<script>
if (navigator.serviceWorker.controller) {
  console.log('active service worker found, no need to register')
} else {
  navigator.serviceWorker.register('sw.js', {
    scope: '/inkscan/'
  }).then(function(reg) {
    console.log('Service worker has been registered for scope:'+ reg.scope);
  });
}
</script>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="msapplication-TileColor" content="#c6181e">
<meta name="theme-color" content="#c6181e">
<meta name="application-name" content="Ink Scan" />
<meta name="apple-mobile-web-app-title" content="Ink Scan" />

<link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="./img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png">
<link rel="mask-icon" href="./img/safari-pinned-tab.svg" color="#c6181e">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/main.css">
<script src="./js/jquery.min.js"></script>
<script src="./js/popper.min.js"></script>
<script src="./js/bootstrap.min.js"></script>

<style>
  .ink-code-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .ink-code-wrapper input {
    flex: 1;
  }

  .edit-ink-btn {
    padding: 6px 10px;
    font-size: 14px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .edit-ink-btn:hover {
    background-color: #0056b3;
  }

  .edit-ink-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }

  .job-completed-banner {
    background-color: #28a745;
    color: white;
    padding: 15px;
    border-radius: 4px;
    margin-bottom: 20px;
    display: none;
    text-align: center;
    font-weight: bold;
  }

  .job-completed-banner.show {
    display: block;
  }

  .btn-group-vertical {
    gap: 8px;
    display: flex;
    flex-direction: column;
  }
</style>
</head>

<body>
        <h2>Ink Batch Recorder</h2>
        <p>Turn on the bluetooth barcode scanner.</p>

        <div class="container">

            <!-- Job Completed Banner -->
            <div id="jobCompletedBanner" class="job-completed-banner">
              ✓ Job Completed! Form is now locked. Clear or start a new job.
            </div>

            <div class="row">
                <div class="col-50">

                    <div class="row">
                        <div class="col-25">
                            <label for="date">Date</label>
                        </div>
                        <div class="col-75">
                            <input type="text" class="form-control" id="dateInput" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-25">
                            <label for="JobNo">Job Number</label>
                        </div>
                        <div class="col-75">
                            <input type="text" class="form-control" id="JobNo" required>
                        </div>
                    </div>

                    <!-- AUTOCOMPLETE INK CODE FIELD WITH EDIT BUTTON -->
                    <div class="row">
                        <div class="col-25">
                            <label for="InkCodeInput">Ink Code</label>
                        </div>
                        <div class="col-75">
                            <div class="ink-code-wrapper">
                                <input type="text" class="form-control input-lg" id="InkCodeInput" autocomplete="off" placeholder="Start typing ink code">
                                <button id="editInkBtn" class="edit-ink-btn" type="button" style="display: none;">✏️ Edit</button>
                            </div>

                            <!-- Autocomplete container -->
                            <div id="autocomplete-list" class="autocomplete-items"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-25">
                            <label for="BatchCode">Batch Code</label>
                        </div>
                        <div class="col-75">
                            <input type="text" class="form-control input-lg" id="BatchCode" placeholder="Scan or enter batch code" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-25">
                            <label for="Weight">Weight</label>
                        </div>
                        <div class="col-75">
                            <input type="text" class="form-control input-lg" id="Weight" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-25"></div>
                        <div class="col-75">
                            <div class="btn-group-vertical">
                                <div style="display: flex; gap: 8px;">
                                    <button id="btn-save-continue" class="btn btn-primary">Save & Continue</button>

                                    <!-- ⭐ FIXED: Clear button now calls resetJob() ⭐ -->
                                    <button id="btn-clear" class="btn btn-primary" onclick="resetJob()">Clear Table</button>
                                </div>

                                <button id="btn-complete-job" class="btn btn-success">Complete/Finish Job</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-50">
                    <table id="ScansTable">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Job Number</th>
                            <th>Ink Code</th>
                            <th>Batch Code</th>
                            <th>Weight</th>
                        </tr>
                        </thead>
                        <tbody id="scansBody"></tbody>
                    </table>

                    <br>

                    <input id="fileElem" type="file" accept=".csv,text/csv" onchange="handleFiles(this.files)" multiple style="display:none">

                    <button id="fileSelect" class="btn btn-primary" onclick="loadCsvFile()">Load CSV file</button>

                </div>
            </div>
        </div>

</body>

<script src="js/FileSaver.js" defer></script>
<script src="js/main1.js" defer></script>
<script src="js/table2csv.js" defer></script>
<script src="js/manup.js" defer></script>
</html>
