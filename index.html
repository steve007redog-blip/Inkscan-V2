<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the shortcut behave like a fullscreen app -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Controls the colour of the status bar -->
    <meta name="theme-color" content="#000000">

    <!-- Optional: App name when added to home screen -->
    <meta name="application-name" content="Ink Scan">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ink Scan</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .container {
            padding: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        input, button {
            font-size: 18px;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #2196f3;
            border: none;
            color: white;
            border-radius: 4px;
        }

        button:active {
            background: #1976d2;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Ink Scan</h1>

        <p>Enter ink code:</p>
        <input id="inkInput" type="text" placeholder="e.g. 12345">

        <button onclick="scanInk()">Scan</button>

        <p id="result"></p>
    </div>

    <script>
        function scanInk() {
            const code = document.getElementById('inkInput').value.trim();
            const result = document.getElementById('result');

            if (!code) {
                result.textContent = "Please enter a code.";
                return;
            }

            // Example logic — replace with your real scan logic
            result.textContent = "Scanned: " + code;
        }
    </script>
</body>
</html>
